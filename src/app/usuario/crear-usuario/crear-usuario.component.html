<app-header></app-header>


<!-- CARD DE CONTENIDO SEGUN PAGINA-->
<div class="card mx-auto mb-5" style="width: 90%; margin-top: 200px;">

  <!--pantalla trasera de carga-->
  <div *ngIf="showSpinner">
    <app-loading-spinner></app-loading-spinner>
  </div>

  <div class="card-header warning-color-dark  d-flex justify-content-start align-items-center">
    <div *ngIf="!usuario.id else elseBlock" class="d-flex align-items-center">
      <h5 class="font-weight-bold text-black"
          style="margin-bottom: 0px !important;"
      > Crear Usuario
      </h5>
    </div>


    <ng-template #elseBlock>
      <h5 class="font-weight-bold text-black"
            style="margin-bottom: 0px !important;"
        > Editar Usuario
        </h5>
    </ng-template>
  </div>


  <div class="card-body">


    <form #usuarioForm="ngForm">

      <div class="col-md-12 mb-4">


        <!-- Grid row -->
        <div class="row">

          <!-- Grid column -->
          <div class="col-lg-6">

            <div class="md-form form-sm mb-0">
              <input type="text"
                     id="nombre"
                     class="form-control form-control-sm"
                     name="nombre"
                     [(ngModel)]="usuario.nombre"
                     required
                     #nombre="ngModel"
              >
              <label for="nombre" class="active">Nombre</label>
              <div class="alert alert-danger"
                   *ngIf="nombre.invalid && nombre.touched || nombre.invalid && usuarioForm.submitted"
              >El nombre es requerido
              </div>
            </div>

          </div>
          <!-- Grid column -->


          <!-- Grid column -->
          <div class="col-lg-6">

            <div class="md-form form-sm mb-0">
              <input type="text"
                     id="nit"
                     class="form-control form-control-sm"
                     name="nit"
                     [(ngModel)]="usuario.nit"
                     required
                     #nit="ngModel"
              >
              <label for="nit" class="active">Nit / Identificación</label>
              <div class="alert alert-danger"
                   *ngIf="nit.invalid && nit.touched || nit.invalid && usuarioForm.submitted"
              >El Nit es requerido
              </div>
            </div>

          </div>

        </div>


        <div class="row mt-3">

          <div class="col-lg-6">
            <div class="md-form form-sm mb-0">
              <input type="text"
                     id="username"
                     class="form-control form-control-sm"
                     name="username"
                     [(ngModel)]="usuario.username"
                     required
                     #username="ngModel"
              >
              <label for="username" class="active">Username</label>
              <div class="alert alert-danger"
                   *ngIf="username.invalid && username.touched || username.invalid && usuarioForm.submitted"
              >El Username es requerido
              </div>
            </div>
          </div>


          <!--LISTA DESPLEGABLE PARA AJUSTAR LOS QUE YA ESTAN SELECT-->
          <div class="col-lg-6">

            <div style="margin-bottom: -8px!important;">
              <p *ngIf="usuario.rolesPrincipal.length>0" class="text-black-50">Roles Activos: </p>
              <p *ngIf="!usuario.rolesPrincipal.length>0" class="text-black-50">Roles: <br></p>
              <div class="d-flex" style="margin-top: -10px;" *ngIf="usuario.rolesPrincipal.length>0">
                <p *ngFor="let obj of usuario.rolesPrincipal" class="text-primary font-weight-bold">{{obj}} &nbsp;&nbsp;&nbsp;</p>
              </div>
            </div>



            <select class="form-control" multiple
                    name="rolesPrincipal" [(ngModel)]="usuario.rolesPrincipal" required
            >
              <option value="ADMIN">ADMIN - ROLE_ADMIN</option>
              <option value="CLI">CLI - Cliente</option>
              <option value="JSER">JSER - Jefe servicio al cliente</option>
              <option value="PRO">PRO - Proveedor</option>
              <option value="SER">SER - Servicio al cliente</option>
            </select>


<!--            <select class="mdb-select md-form" multiple searchable="Buscar.."
                    name="rolesPrincipal" [(ngModel)]="usuario.rolesPrincipal" required
                    style="margin-top: -45px!important;"
            >
              <option value="" disabled selected>Seleccionar...</option>
              <option value="ADMIN">ADMIN - ROLE_ADMIN</option>
              <option value="CLI">CLI - Cliente</option>
              <option value="JSER">JSER - Jefe servicio al cliente</option>
              <option value="PRO">PRO - Proveedor</option>
              <option value="SER">SER - Servicio al cliente</option>
            </select>
            <button class="btn-save btn btn-primary btn-sm">Guardar</button>-->

          </div>

        </div>



        <div class="row mt-3">

          <div class="col-lg-6">
            <div class="md-form form-sm mb-0">
              <input type="email"
                     id="email"
                     class="form-control form-control-sm"
                     name="email"
                     [(ngModel)]="usuario.email"
                     required
                     #email="ngModel"
              >
              <label for="email" class="active">Correo Electronico</label>
              <div class="alert alert-danger"
                   *ngIf="email.invalid && email.touched || email.invalid && usuarioForm.submitted"
              >El Email es requerido
              </div>
            </div>
          </div>


          <div class="col-lg-6">
            <div class="md-form form-sm mb-0">

              <input type="password"
                     id="password"
                     name="password"
                     class="form-control form-control-sm"
                     [(ngModel)]="usuario.password"
                     required
                     *ngIf="!usuario.id else elseBlock3"
              >
              <label for="password" class="active">Contraseña</label>

              <ng-template #elseBlock3>
              <input type="password"
                     id="pass"
                     name="pass"
                     class="form-control form-control-sm"
                     value="xxxxxx"
                     required
                     disabled
              >
                <label for="pass" class="active">Contraseña</label>
              </ng-template>

            </div>
          </div>

        </div>
        <!-- Grid column -->


        <div class="row mt-4">
          <div class="col-lg-6">
            <fieldset class="form-check" style="padding: 0px !important;">
              <input class="form-check-input"
                     type="checkbox"
                     id="primerLogin"
                     name="primerLogin"
                     [(ngModel)]="usuario.primerLogin"
                     [value]="usuario.primerLogin"
              >
              <label class="form-check-label" for="primerLogin">Solicitar cambio al ingresar</label>
            </fieldset>
          </div>


          <div class="mt-4" *ngIf="usuario.id">
            <button class="btn-dark-green btn btn-rounded" data-toggle="modal" data-target="#modalLoginForm" (click)="limpiarCamposPassword()">
              Cambiar Contraseña
            </button>
          </div>

        </div>


        <!--BOTONES -->
        <div class="row">
          <div class="mt-4">
            <button class="btn-primary btn btn-rounded"
                    (click)="crearUsuario()"
                    *ngIf="!usuario.id else elseBlock2"
                    [disabled]="usuario.nombre.length==0 || usuario.nit.length==0 || usuario.username.length==0 ||
                                usuario.rolesPrincipal.length==0 || usuario.email.length==0 || usuario.password.length == 0"
            >Crear
            </button>

            <ng-template #elseBlock2>
              <button class="btn-primary btn btn-rounded"
                      (click)="updateUsuario()"
                      [disabled]="usuario.nombre.length==0 || usuario.nit.length==0 || usuario.username.length==0 ||
                                usuario.rolesPrincipal.length==0 || usuario.email.length==0 || usuario.password.length == 0"
              >Editar
              </button>
            </ng-template>
          </div>

          <div class="mt-4">
            <button class="btn-danger btn btn-rounded" [routerLink]="['/lista-usuarios']"
            >Regresar
            </button>
          </div>

        </div>

      </div>
      <!-- Grid column -->

    </form>


  </div>


</div>






<!--CREACION DEL MODAL-->

<div class="modal fade" id="modalLoginForm" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
     aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header text-center">
        <h4 class="modal-title w-100 font-weight-bold">Cambiar Contraseña</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body mx-3">

        <div class="md-form mb-4">
          <i class="fas fa-lock-open prefix grey-text"></i>
          <input type="password" id="passwordNuevo" class="form-control validate" [(ngModel)]="passwordNuevo">
          <label for="passwordNuevo">Nueva Contraseña</label>
        </div>

        <div class="md-form mb-4">
          <i class="fas fa-lock prefix grey-text"></i>
          <input type="password" id="passwordNuevoRepetir" class="form-control validate" [(ngModel)]="repetirPasswordNuevo">
          <label for="passwordNuevoRepetir">Repetir Contraseña</label>
        </div>

      </div>
      <div class="modal-footer d-flex justify-content-center">
        <button
          class="btn btn-primary btn-rounded"
          (click)="cambiarPasswordOtroUsuario()"
          [disabled]="passwordNuevo!=repetirPasswordNuevo || passwordNuevo.length==0 || repetirPasswordNuevo.length==0"
          data-dismiss="modal"
          aria-label="Close"
        >Aceptar Cambios
        </button>
      </div>
    </div>
  </div>
</div>
