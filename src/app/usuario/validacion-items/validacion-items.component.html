<app-header></app-header>


<!-- CARD DE CONTENIDO SEGUN PAGINA-->
<div class="card mx-auto" style="width: 90%; margin-top: 200px; margin-bottom: 280px">

  <div class="card-header warning-color-dark d-flex justify-content-start align-items-center">
    <div class="d-flex align-items-center">
      <i class="fas fa-check-double text-black-50 fa-2x"></i>
      <h5 class="font-weight-bold text-black ml-2">Validación de ítems</h5>
    </div>

  </div>


  <div class="card-body">


    <div class="row">


      <!-- Grid column -->
      <div class="col-md-4">
        <div class="md-form md-outline">
          <i class="fas fa-search prefix"></i>
          <input type="text"
                 (keyup)="getUserIdsFirstWay($event)"
                 id="buscar"
                 list="dynmicUserIds"
                 class="form-control"
                 style="margin-bottom: 0px !important;"
                 [(ngModel)]="coditemPatronBuscado"
                 (change)="consultarTipoExt()"
          >
          <datalist id="dynmicUserIds">
            <option *ngFor="let item of userList1">{{item}}</option>
          </datalist>
          <label for="buscar">Código del ítem</label>
        </div>
      </div>


      <div class="col-md-4">
        <label class="small"
               style="margin-top: 7px; margin-left: 10px;z-index: 100"
        >Ext 1</label>
        <select class="form-control"
                style="margin-top: -10px"
                [(ngModel)]="seleccionExt1"
        >
          <option value="" disabled selected>Seleccionar</option>
          <option [value]="item" *ngFor="let item of listaExt1">{{item}}</option>
        </select>
      </div>


      <div class="col-md-4">
        <label class="small"
               style="margin-top: 7px; margin-left: 10px;z-index: 100"
        >Ext 2</label>
        <select class="form-control"
                style="margin-top: -10px"
                [(ngModel)]="seleccionExt2"
        >
          <option value="" disabled selected>Seleccionar</option>
          <option [value]="item" *ngFor="let item of listaExt2">{{item}}</option>
        </select>
      </div>


    </div>



    <!--          [disabled]="itemPedidoActual.cantidad<1"
          (click)="agregarItem()"-->
    <div class="row mb-5 d-flex justify-content-center">
      <button class="btn btn-success btn-rounded"
              style="min-width: 270px"
              (click)="consultarItem()"
              [disabled]="codigoItem.trim()==''"
      ><i class="fas fa-search"></i>
        Consultar Ítem
      </button>
    </div>







    <div class="row">

      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-building prefix"></i>
          <input type="text"
                 id="cod-item"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="codigoItem"
          >
          <label for="cod-item" class="active">Código del ítem</label>
        </div>
      </div>



      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-align-center prefix"></i>
          <input type="text"
                 id="referencia"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="referencia"
          >
          <label for="referencia" class="active">Referencia</label>
        </div>
      </div>



      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-ruler-vertical prefix"></i>
          <input type="text"
                 id="extension-1"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="ext1"
          >
          <label for="extension-1" class="active">Ext 1</label>
        </div>
      </div>


      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-tint prefix"></i>
          <input type="text"
                 id="extension-2"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="ext2"
          >
          <label for="extension-2" class="active">Ext 2</label>
        </div>
      </div>



      <div class="col-md-6">
        <div class="md-form md-outline">
          <i class="fas fa-receipt prefix"></i>
          <input type="text"
                 id="descripcion"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="descripcion"
          >
          <label for="descripcion" class="active">Descripción</label>
        </div>
      </div>



      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-ruler-vertical prefix"></i>
          <input type="text"
                 id="descripcion-extension-1"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="descExt1"
          >
          <label for="descripcion-extension-1" class="active">Descripción Ext 1</label>
        </div>
      </div>


      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-tint prefix"></i>
          <input type="text"
                 id="descripcion-extension-2"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="descExt2"
          >
          <label for="descripcion-extension-2" class="active">Descripción Ext 2</label>
        </div>
      </div>


      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-balance-scale-left prefix"></i>
          <input type="text"
                 id="unidad-inventario"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="undInventario"
          >
          <label for="unidad-inventario" class="active">Unidad de inventario</label>
        </div>
      </div>



      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-balance-scale-left prefix"></i>
          <input type="text"
                 id="unidad-orden"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="undOrden"
          >
          <label for="unidad-orden" class="active">Unidad de orden</label>
        </div>
      </div>


      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-barcode prefix"></i>
          <input type="text"
                 id="codigo-barra"
                 class="form-control border-primary"
                 disabled
                 [(ngModel)]="codBarra"
          >
          <label for="codigo-barra" class="active">Codigo de barra</label>
        </div>
      </div>




      <div class="col-md-3">
        <div class="md-form md-outline">
          <i class="fas fa-boxes prefix"></i>
          <input type="text"
                 id="disponible"
                 class="form-control border-primary"
                 disabled
          >
          <label for="disponible" class="active">Disponible</label>
        </div>
      </div>





    </div>


  </div>
</div>
