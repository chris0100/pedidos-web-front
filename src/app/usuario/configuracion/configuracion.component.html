<app-header></app-header>

<!-- CARD DE CONTENIDO SEGUN PAGINA-->
<div class="card mx-auto" style="width: 90%; margin-top: 200px; margin-bottom: 280px">

  <div class="card-header warning-color-dark">
    <h5 class="font-weight-bold text-black">Configuración</h5>
  </div>


  <div class="card-body">

    <div class="col-md-12 mb-4">


      <!-- Card Data -->
      <div class="admin-up d-flex justify-content-start align-items-center">
        <i class="fas fa-cog fa-2x"></i>
        <h5 class="font-weight-bold dark-grey-text ml-2" style="margin-bottom: 0px !important;">
          Formulario de actualización de datos de acceso
        </h5>
      </div>
      <!-- Card Data -->


      <form #clienteForm="ngForm">

      <!-- Grid row -->
      <div class="row mt-3">

        <!-- Grid column -->
        <div class="col-lg-8">

          <div class="md-form form-sm mb-0">
            <input type="text"
                   id="nombre"
                   class="form-control form-control-sm"
                   [(ngModel)]="nombreUsuario"
                   name="nombre"
                   #nombre="ngModel"
                   required="required"
                   value="usuario.nombre"
            >
            <label for="nombre" class="active">Nombre del Responsable</label>
            <div class="alert alert-danger" *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)">
              <div *ngIf="nombre.errors.required">
                Nombre es requerido
              </div>
              <div *ngIf="nombre.errors.minlength">
                Nombre debe tener al menos 4 caracteres
              </div>
            </div>
          </div>


        </div>
        <!-- Grid column -->

      </div>



      <div class="row mt-3">

        <!-- Grid column -->
        <div class="col-lg-8">

          <div class="md-form form-sm mb-0">
            <input type="text"
                   id="email"
                   class="form-control form-control-sm"
                   [(ngModel)]="emailUsuario"
                   name="email"
                   #email="ngModel"
                   required="required"
            >
            <label for="email" class="active">Correo Corporativo</label>
            <div class="alert alert-danger" *ngIf="email.invalid && (email.dirty || email.touched)">
              <div *ngIf="email.errors.required">
                Email es requerido
              </div>
              <div *ngIf="email.errors.email">
                Email debe tener un formato válido
              </div>
            </div>
          </div>

        </div>

      </div>
      <!-- Grid column -->



      <div class="row mt-3">
        <!-- Grid column -->
        <div class="col-lg-8">

          <div class="md-form form-sm mb-0">
            <input type="password"
                   id="password"
                   class="form-control form-control-sm"
                   disabled
                   value="xxxxxx"
            >
            <label for="password" class="active">Contraseña</label>
          </div>

        </div>
        <!-- Grid column -->
      </div>


      <div class="row">
        <div class="mt-4">
          <button class="btn-primary btn btn-rounded"
                  (click)="update()"
                  [disabled]="!clienteForm.form.valid || nombreUsuario.length==0 || emailUsuario.length==0"
          >Aceptar Cambios</button>
        </div>

        <div class="mt-4">
          <button class="btn-dark-green btn btn-rounded" data-toggle="modal" data-target="#modalLoginForm">
            Cambiar Contraseña
          </button>
        </div>

        <div class="mt-4">
          <button class="btn-danger btn btn-rounded" [routerLink]="['/panel-principal']" style="min-width: 200px">
            Regresar
          </button>
        </div>

      </div>

      </form>




    </div>
    <!-- Grid column -->


  </div>


</div>



<!--CREACION DEL MODAL-->

<div class="modal fade" id="modalLoginForm" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
     aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header text-center">
        <h4 class="modal-title w-100 font-weight-bold">Cambiar Contraseña</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body mx-3">

        <div class="md-form mb-4">
          <i class="fas fa-key prefix grey-text"></i>
          <input type="password" id="passwordActual" class="form-control validate" [(ngModel)]="passwordActual">
          <label for="passwordActual">Contraseña Actual</label>
        </div>

        <div class="md-form mb-4">
          <i class="fas fa-lock-open prefix grey-text"></i>
          <input type="password" id="passwordNuevo" class="form-control validate" [(ngModel)]="passwordNuevo">
          <label for="passwordNuevo">Nueva Contraseña</label>
        </div>

        <div class="md-form mb-4">
          <i class="fas fa-lock prefix grey-text"></i>
          <input type="password" id="repetirPasswordNuevo"  [(ngModel)]="repetirPasswordNuevo" class="form-control validate">
          <label for="repetirPasswordNuevo">Repetir Contraseña</label>
        </div>

      </div>
      <div class="modal-footer d-flex justify-content-center">
        <button
          class="btn btn-primary btn-rounded"
          (click)="cambiarPassword()"
          [disabled]="passwordNuevo!=repetirPasswordNuevo || passwordNuevo.length==0 || repetirPasswordNuevo.length==0
                      || passwordActual.length==0"
          data-dismiss="modal"
          aria-label="Close"
        >Aceptar Cambios
        </button>
      </div>
    </div>
  </div>
</div>
