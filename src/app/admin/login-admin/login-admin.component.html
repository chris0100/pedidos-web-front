<div class="row" style="height: 100vh">

  <div class="col-sm-4 sn-bg-4" style="border-right: 5px solid #025f97">

    <div class="text-center mt-2">
      <a class="pl-0"><img src="resources/img/logos/logo-eka.png" alt=""></a>
    </div>

  </div>


  <div class="col-sm-8 d-flex align-items-center"
       style="background: url(resources/img/demo8/bg-29.jpg); background-position: center; background-size: cover">

    <!-- Grid column -->
    <div class="col-md-6 mb-4 mx-auto">


      <!-- Modal: Login cliente / proveedor tabs -->
      <div class="modal-dialog cascading-modal" role="document">

        <!-- Content -->
        <div class="modal-content">

          <!-- Modal con tabs -->
          <div class="modal-c-tabs">

            <!-- Nav tabs -->
            <ul class="nav md-tabs tabs-2 light-blue darken-3" role="tablist">
              <li class="nav-item">
                <a class="nav-link active" data-toggle="tab" href="#panel1" role="tab">
                  Administrador</a>
              </li>
            </ul>

            <!-- Tab panels -->
            <div class="tab-content">

              <!--Panel 1 clientes login-->
              <div class="tab-pane fade in show active" id="panel1" role="tabpanel">



                <!-- Body -->
                <div class="modal-body">

                  <div class="text-center">
                    <h4 class="font-weight-bold dark-grey-text"><i class="fas fa-users p-2 fa-1x"></i> Portal Web</h4>
                  </div>


                  <!--INPUT USUARIO-->
                  <div class="md-form md-outline font-weight-bold">
                    <input type="text" id="nit-proveedor" class="form-control" [(ngModel)]="usuario.username">
                    <label for="nit-proveedor">Usuario</label>
                  </div>

                  <!--INPUT CONTRASEÑA-->
                  <div class="md-form md-outline font-weight-bold">
                    <input type="password" id="password-proveedor" class="form-control" [(ngModel)]="usuario.password">
                    <label for="password-proveedor">Contraseña</label>
                  </div>

                  <div class="text-center form-sm mt-2">
                    <button class="btn btn-primary btn-rounded"
                            type="submit"
                            (click)="loginAdmin()"
                            [disabled]="usuario.username.length==0 || usuario.password.length==0"
                    >
                      Ingresar <i class="fas fa-sign-in-alt ml-1"></i>
                    </button>
                  </div>

                </div>

                <!-- Footer -->
                <div class="modal-footer display-footer">
                  <div class="options text-center text-md-right mt-1">
                    <p>¿Necesitas <a href="#" class="blue-text">Ayuda?</a></p>
                  </div>
                </div>


              </div>
              <!--FIN Panel 1 -->



            </div>

          </div>

          <small class="font-weight-bold text-center" style="margin-top: -20px">Copyright &copy; 2020 Eka Corporación
            S.A.</small>
          <a href="#" class="text-center"><small class="font-weight-bold">Términos y
            Condiciones</small></a>


        </div>
        <!-- Content -->


      </div>
      <!-- Modal: Login & Register tabs -->


    </div>
    <!-- Grid column -->


  </div>

</div>
