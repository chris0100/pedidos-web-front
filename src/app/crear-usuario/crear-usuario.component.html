<app-header></app-header>


<!-- CARD DE CONTENIDO SEGUN PAGINA-->
<div class="card mx-auto" style="width: 90%; margin-top: 200px">

  <div class="card-header warning-color-dark  d-flex justify-content-start align-items-center">
    <i class="fas fa-user-plus fa-2x text-black-50"></i>
    <h5 class="font-weight-bold text-black ml-2" style="margin-bottom: 0px !important;"> Crear Usuario</h5>
  </div>


  <div class="card-body">


    <form #usuarioForm="ngForm">

    <div class="col-md-12 mb-4">


      <!-- Grid row -->
      <div class="row">

        <!-- Grid column -->
        <div class="col-lg-6">

          <div class="md-form form-sm mb-0">
            <input type="text"
                   id="nombre"
                   class="form-control form-control-sm"
                   name="nombre"
                   [(ngModel)]="usuario.nombre"
                   required
                   #nombre="ngModel"
            >
            <label for="nombre" class="">Nombre</label>
            <div class="alert alert-danger"
                 *ngIf="nombre.invalid && nombre.touched || nombre.invalid && usuarioForm.submitted"
            >El nombre es requerido
            </div>
          </div>

        </div>
        <!-- Grid column -->



        <!-- Grid column -->
        <div class="col-lg-6">

          <div class="md-form form-sm mb-0">
            <input type="text"
                   id="nit"
                   class="form-control form-control-sm"
                   name="nit"
                   [(ngModel)]="usuario.nit"
                   required
                   #nit="ngModel"
            >
            <label for="nit" class="">Nit / Identificación</label>
            <div class="alert alert-danger"
                 *ngIf="nit.invalid && nit.touched || nit.invalid && usuarioForm.submitted"
            >El Nit es requerido
            </div>
          </div>

        </div>

      </div>


      <div class="row mt-3">

        <div class="col-lg-12">
          <div class="md-form form-sm mb-0">
            <input type="text"
                   id="username"
                   class="form-control form-control-sm"
                   name="username"
                   [(ngModel)]="usuario.username"
                   required
                   #username="ngModel"
            >
            <label for="username">Username</label>
            <div class="alert alert-danger"
                 *ngIf="username.invalid && username.touched || username.invalid && usuarioForm.submitted"
            >El Username es requerido
            </div>
          </div>
        </div>

      </div>


      <div class="row mt-3">

        <div class="col-lg-6">

          <select class="mdb-select colorful-select dropdown-primary md-form" multiple
                  searchable="Filtrar.." name="roles" [(ngModel)]="usuario.rolesPrincipal" required>
            <option value="" disabled selected>Seleccionar Roles</option>
            <option value="ADMIN">Admin - ROLE_ADMIN</option>
            <option value="CLI">CLI - Cliente</option>
            <option value="ITE">ITE - Validar item existente en unoee</option>
            <option value="JSER">JSER - Jefe servicio al cliente</option>
            <option value="PRO">PRO - Proveedor</option>
            <option value="SER">SER - Servicio al cliente</option>
            <option value="USER">USER - ROLE_USER</option>
          </select>
          <button class="btn-save btn btn-primary btn-sm">Guardar</button>

        </div>


        <div class="col-lg-6">
          <div class="md-form form-sm mb-0">
            <input type="email"
                   id="email"
                   class="form-control form-control-sm"
                   name="email"
                   [(ngModel)]="usuario.email"
                   required
                   #email="ngModel"
            >
            <label for="email">Correo Electronico</label>
            <div class="alert alert-danger"
                 *ngIf="email.invalid && email.touched || email.invalid && usuarioForm.submitted"
            >El Email es requerido
            </div>
          </div>
        </div>

      </div>
      <!-- Grid column -->





      <div class="row mt-3">

        <div class="col-lg-6">
          <div class="md-form form-sm mb-0">
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control form-control-sm"
                   [(ngModel)]="usuario.password"
                   required
                   #password="ngModel"
            >
            <label for="password">Contraseña</label>
            <div class="alert alert-danger"
                 *ngIf="password.invalid && password.touched || password.invalid && usuarioForm.submitted"
            >El Password es requerido
            </div>
          </div>
        </div>



        <div class="col-lg-6">
          <div class="md-form form-sm mb-0">
            <input type="password" id="rep-password" class="form-control form-control-sm">
            <label for="rep-password">Repetir Contraseña</label>
          </div>
        </div>

      </div>


      <div class="row mt-4">
        <div class="col-lg-6">
          <fieldset class="form-check" style="padding: 0px !important;">
            <input class="form-check-input"
                   type="checkbox"
                   id="primerLogin"
                   name="primerLogin"
                   [(ngModel)]="usuario.primerLogin"
            >
            <label class="form-check-label" for="primerLogin">Solicitar cambio al ingresar</label>
          </fieldset>
        </div>

      </div>





      <!--BOTONES -->
      <div class="row">
        <div class="mt-4">
          <button class="btn-primary btn btn-rounded" (click)="crearUsuario()">Aceptar</button>
        </div>

        <div class="mt-4">
          <button class="btn-danger btn btn-rounded" [routerLink]="['/lista-usuarios']"
          >Cancelar</button>
        </div>

      </div>


    </div>
    <!-- Grid column -->

    </form>


  </div>


</div>
