<!-- Grid row -->
<div class="row">

  <!-- Grid column -->
  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-search prefix"></i>
      <input type="text"
             id="cod-item-cliente"
             class="form-control"
             style="margin-bottom: 0px !important;"
             [(ngModel)]="codigoCliente"
             (change)="consultarItemHomologado()"
      >
      <label for="cod-item-cliente" data-error="wrong" data-success="right">Código del
        cliente del ítem</label>
    </div>
  </div>


  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-building prefix"></i>
      <input type="text"
             id="cod-item-eka"
             class="form-control"
             disabled
             style="background-color: #e7e7e5"
             [(ngModel)]="itemPatron"
      >
      <label for="cod-item-eka" class="active">Código del ítem EKA</label>
    </div>


  </div>

  <div class="col-md-4">
    <div class="md-form md-outline">
      <i class="fas fa-ruler-vertical prefix"></i>
      <input type="text"
             id="tamano-eka"
             class="form-control"
             disabled
             style="background-color: #e7e7e5"
             [(ngModel)]="ext1"
      >
      <label for="tamano-eka" class="active">{{descripcionLabelExt1}}</label>
    </div>

  </div>


</div>


<div class="row" style="margin-top: -30px">

  <!-- Grid column -->
  <div class="col-md-4">
    <div class="md-form md-outline">
      <i class="fas fa-tint prefix"></i>
      <input type="text"
             id="color-eka"
             class="form-control"
             disabled
             style="background-color: #e7e7e5"
             [(ngModel)]="ext2"
      >
      <label for="color-eka" class="active">{{descripcionLabelExt2}}</label>
    </div>

  </div>


  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-balance-scale-left prefix"></i>
      <input type="text"
             id="unidad-medida-eka"
             class="form-control"
             disabled
             style="background-color: #e7e7e5"
             [(ngModel)]="itemPedidoActual.unidadMedida"
      >
      <label for="unidad-medida-eka" class="active">Unidad de
        Medida</label>
    </div>

  </div>


  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-boxes prefix"></i>
      <input type="text"
             id="cantidad-eka"
             class="form-control"
             [(ngModel)]="itemPedidoActual.cantidad"
      >
      <label for="cantidad-eka" class="active">Cantidad</label>
    </div>

  </div>


</div>


<div class="row mb-5 d-flex justify-content-center">
  <button class="btn btn-success btn-rounded"
          style="min-width: 270px"
          [disabled]="itemPedidoActual.cantidad<1"
          (click)="agregarItem()"
  ><i class="fas fa-plus"></i>
    Agregar ítem
  </button>
</div>


<div class="table-responsive table-striped table-hover" *ngIf="listaInputItemPedidoSelect.length>0">
  <table class="table">

    <thead>
    <tr>
      <th scope="col" class="font-weight-bold">Código del ítem</th>
      <th scope="col" class="font-weight-bold">Código EKA</th>
      <th scope="col" class="font-weight-bold">Descripción</th>
      <th scope="col" class="font-weight-bold">Extensión 1</th>
      <th scope="col" class="font-weight-bold">Extensión 2</th>
      <th scope="col" class="font-weight-bold">Cantidad</th>
      <th scope="col" class="font-weight-bold">U. Medida</th>
      <th scope="col" class="font-weight-bold"></th>
    </tr>
    </thead>


    <tbody>
    <tr *ngFor="let item of listaInputItemPedidoSelect">
      <th scope="row">{{item.codCliente}}</th>
      <td>{{item.codItem}}</td>
      <td>{{item.descripcion}}</td>
      <td>{{item.descripcionExt1}}</td>
      <td>{{item.descripcionExt2}}</td>
      <td>{{item.cantidad}}</td>
      <td>{{item.unidadMedida}}</td>
      <td><a (click)="removerItem(item)"><i class="fas fa-trash"></i></a></td>
    </tr>
    </tbody>

  </table>
</div>


<div class="mt-3 mb-4 text-center" *ngIf="listaInputItemPedidoSelect.length==0">
  <h5 class="p-1 font-weight-bold">Aún no has añadido ítems</h5>
</div>
