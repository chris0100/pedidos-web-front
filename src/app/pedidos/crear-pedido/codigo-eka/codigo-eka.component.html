<!-- Grid row -->
<div class="row">


  <!-- Grid column -->
  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-search prefix"></i>
      <input type="text"
             (keyup)="getUserIdsFirstWay($event)"
             id="buscar"
             list="dynmicUserIds"
             class="form-control"
             style="margin-bottom: 0px !important;"
             [(ngModel)]="coditemPatronBuscado"
             (change)="consultarTipoExt()"
      >
      <datalist id="dynmicUserIds">
        <option *ngFor="let item of userList1">{{item}}</option>
      </datalist>
      <label for="buscar">Código del ítem</label>
    </div>
  </div>


  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-balance-scale-left prefix"></i>
      <input type="text" id="unidad-medida-ce" class="form-control" [value]="itemPedidoActual.unidadMedida"
             style="background-color: #e7e7e5" disabled>
      <label for="unidad-medida-ce" class="active">Unidad de
        Medida</label>
    </div>

  </div>

  <div class="col-md-4">
    <label class="small">{{descripcionLabelExt1}}</label>
    <select class="form-control"
            [(ngModel)]="itemPedidoActual.descripcionExt1"
            style="margin-top: -6px"
    >
      <option value="" disabled selected>Seleccionar</option>
      <option [value]="item" *ngFor="let item of listaExt1">{{item}}</option>
    </select>
  </div>


</div>


<div class="row" style="margin-top: -30px">

  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-tint prefix"></i>
      <input type="text"
             (keyup)="getUserIdsFirstWay2($event)"
             id="buscar-color"
             list="dynmicUserIds2"
             class="form-control"
             style="margin-bottom: 0px !important;"
             [(ngModel)]="itemPedidoActual.descripcionExt2"
      >
      <datalist id="dynmicUserIds2">
        <option *ngFor="let item of userList2">{{item}}</option>
      </datalist>
      <label for="buscar-color">{{descripcionLabelExt2}}</label>
    </div>

  </div>



  <div class="col-md-4">

    <div class="md-form md-outline">
      <i class="fas fa-boxes prefix"></i>
      <input type="text" id="cantidad" class="form-control" [(ngModel)]="itemPedidoActual.cantidad">
      <label for="cantidad" class="active">Cantidad</label>
    </div>

  </div>


</div>


<div class="row mb-5 d-flex justify-content-center" style="margin-top: -15px">
  <button class="btn btn-success btn-rounded"
          style="min-width: 270px"
          (click)="agregarItem()"
          [disabled]="itemPedidoActual.cantidad<1"
  >
    <i class="fas fa-plus"></i> Agregar
    ítem
  </button>
</div>


<div class="table-responsive table-striped table-hover" *ngIf="listaItemPedidoSelect.length>0">
  <table class="table">
    <thead>
    <tr>
      <th scope="col" class="font-weight-bold">Código del ítem</th>
      <th scope="col" class="font-weight-bold">Código EKA</th>
      <th scope="col" class="font-weight-bold">Descripción</th>
      <th scope="col" class="font-weight-bold">Extensión 1</th>
      <th scope="col" class="font-weight-bold">Extensión 2</th>
      <th scope="col" class="font-weight-bold">Cantidad</th>
      <th scope="col" class="font-weight-bold">U. Medida</th>
      <th scope="col" class="font-weight-bold"></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of listaItemPedidoSelect">
      <th scope="row">{{item.codCliente}}</th>
      <td>{{item.codItem}}</td>
      <td>{{item.descripcion}}</td>
      <td>{{item.descripcionExt1}}</td>
      <td>{{item.descripcionExt2}}</td>
      <td>{{item.cantidad}}</td>
      <td>{{item.unidadMedida}}</td>
      <td><a (click)="removerItem(item)"><i class="fas fa-trash"></i></a></td>
    </tr>

    </tbody>
  </table>
</div>

<div class="mt-3 mb-4 text-center" *ngIf="listaItemPedidoSelect.length==0">
  <h5 class="p-1 font-weight-bold">Aún no has añadido ítems</h5>
</div>
