

  <!-- Body -->
  <div class="modal-body">

    <div class="text-center" style="margin-top: -30px;">
      <h5 class="font-weight-bold dark-grey-text"><i class="fas fa-users p-2 fa-1x"></i> Portal Web</h5>
    </div>


    <div class="md-form md-outline">
      <input type="text" id="nit-proveedor" class="form-control" [(ngModel)]="usuario.username">
      <label for="nit-proveedor" class="active">Nit Proveedor</label>
    </div>

    <div class="md-form md-outline">
      <input type="password" id="password-proveedor" class="form-control" [(ngModel)]="usuario.password">
      <label for="password-proveedor" class="active">Contraseña</label>
    </div>

    <div class="text-center form-sm mt-2">
      <button class="btn btn-primary btn-rounded"
              (click)="loginProveedor()"
              type="submit"
              [disabled]="usuario.username.length==0 || usuario.password.length==0"
      >
        Ingresar <i class="fas fa-sign-in-alt ml-1"></i>
      </button>
    </div>

  </div>

  <!-- Footer -->
  <div class="modal-footer display-footer">
    <div class="options text-center text-md-right mt-1">
      <p>¿Necesitas <a [routerLink]="['/ayuda']" class="blue-text">Ayuda?</a></p>
      <p style="margin-top: -10px;">¿Contraseña <a [routerLink]="['/reestablecer-password', 1]" class="blue-text">Olvidada?</a></p>
      <!--<p>¿Ingresar como <a [routerLink]="['/login-admin']" class="blue-text">Administrador?</a></p>-->
    </div>
  </div>
