<!-- Body -->
<div class="modal-body">

  <div class="text-center">
    <h4 class="font-weight-bold dark-grey-text"><i class="fas fa-key"></i> Reestablece tu contraseña</h4>
  </div>

  <!--pantalla trasera de carga-->
  <div *ngIf="showSpinner">
    <app-loading-spinner></app-loading-spinner>
  </div>

  <div class="md-form md-outline font-weight-bold">
    <input type="text" id="nit-proveedor" class="form-control" [(ngModel)]="usuario.nit">
    <label for="nit-proveedor">Nit</label>
  </div>

  <div class="md-form md-outline font-weight-bold">
    <input type="email" id="password-proveedor" class="form-control" [(ngModel)]="usuario.email">
    <label for="password-proveedor">Correo Electrónico</label>
  </div>

  <div class="text-center form-sm mt-2">
    <button class="btn btn-primary btn-rounded"
            (click)="recuperarPassword()"
            type="submit"
            [disabled]="usuario.nit.length==0 || usuario.email.length==0"
    >
      Recuperar <i class="fas fa-sign-in-alt ml-1"></i>
    </button>
  </div>

</div>
