<!-- Body -->

<div class="modal-body">

  <div class="text-center">
    <h4 class="font-weight-bold dark-grey-text"><i class="fas fa-key"></i> Reestablece tu contraseña</h4>
  </div>


  <!--pantalla trasera de carga-->
  <div *ngIf="showSpinner">
    <app-loading-spinner></app-loading-spinner>
  </div>


  <form method="post">

    <div class="md-form md-outline font-weight-bold">
      <input type="text"
             id="nit-cliente"
             class="form-control"
             name="nit"
             [(ngModel)]="usuario.nit"
             (change)="obtenerSucursal()"
      >
      <label for="nit-cliente">Nit</label>
    </div>


    <div class="row" style="margin-top: -10px">
      <div class="col-md-12">

        <label>Sucursal</label>
        <select class="form-control"
                name="sucursalSeleccionada"
                id="sucursalSeleccionada"
                [(ngModel)]="sucursalSeleccionada"
                (change)="obtenerPuntoEnvio()"
                style="margin-top: -5px"
        >
          <option value="" disabled selected class="font-weight-bold">Seleccionar</option>
          <option [value]="item" *ngFor="let item of listadoSucursal">{{item}}</option>
        </select>

      </div>
    </div>



    <div class="row mt-3">
      <div class="col-md-12">

        <div class="form-group">
          <label>Punto de Envio</label>
          <select class="form-control"
                  name="puntoEnvioSeleccionado"
                  id="puntoEnvioSeleccionado"
                  [(ngModel)]="puntoEnvioSeleccionado"
                  style="margin-top: -5px"
          >
            <option value="" disabled selected class="font-weight-bold">Seleccionar</option>
            <option [value]="item" *ngFor="let item of listadoPuntoEnvio">{{item}}</option>
          </select>
        </div>

      </div>
    </div>




    <div class="md-form md-outline font-weight-bold" style="margin-top: 5px">
      <input type="email"
             id="email-cliente"
             class="form-control"
             name="email"
             [(ngModel)]="usuario.email"
      >
      <label for="email-cliente">Correo Electrónico</label>
    </div>


    <div class="text-center">
      <button class="btn btn-primary btn-rounded"
              type="submit"
              (click)="recuperarPassword()"
              [disabled]="usuario.nit.length==0 || sucursalSeleccionada.length==0 || puntoEnvioSeleccionado.length==0 ||
                usuario.email.length==0 || !usuario.email.includes('@') || !usuario.email.includes('.')"
      >
        Recuperar <i class="fas fa-sign-in-alt ml-1"></i>
      </button>
    </div>


  </form>

</div>
