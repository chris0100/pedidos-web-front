<div class="row" style="height: 100vh">

  <div class="col-sm-4 sn-bg-4" style="border-right: 5px solid #025f97">

    <div class="text-center mt-2">
      <a class="pl-0"><img src="resources/img/logos/logo-eka.png" [routerLink]="['/login']" class="adaptive"></a>
    </div>

  </div>


  <div class="col-sm-8 d-flex align-items-center"
       style="background: url(resources/img/demo8/bg-10.jpg); background-position: center; background-size: cover">

    <!-- Grid column -->
    <div class="col-md-6 mx-auto">


      <!-- Modal: Login cliente / proveedor tabs -->
      <div class="modal-dialog cascading-modal" role="document">


        <!-- Content -->
        <div class="modal-content">

          <!-- Modal con tabs -->
          <div class="modal-c-tabs">

            <!-- Nav tabs -->
            <ul class="nav md-tabs tabs-2 light-blue darken-3" role="tablist" *ngIf="idPage==0">
              <li class="nav-item">
                <a class="nav-link active" data-toggle="tab" href="#panel1" role="tab">
                  Cliente</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#panel2" role="tab">
                  Proveedor</a>
              </li>
            </ul>


            <!-- Nav tabs -->
            <ul class="nav md-tabs tabs-2 light-blue darken-3" role="tablist" *ngIf="idPage==1">
              <li class="nav-item">
                <a class="nav-link " data-toggle="tab" href="#panel1" role="tab">
                  Cliente</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" data-toggle="tab" href="#panel2" role="tab">
                  Proveedor</a>
              </li>
            </ul>


            <!--OPCION PARA INGRESO POR CLIENTE-->
            <!-- Tab panels -->
            <div class="tab-content" *ngIf="idPage==0">

              <!--Panel 1 clientes login-->
              <div class="tab-pane fade active show in" [ngClass]="" id="panel1" role="tabpanel">
                <app-reestablecer-clientes></app-reestablecer-clientes>
              </div>
              <!--FIN Panel 1 -->


              <!--Panel 2 proveedores login-->
              <div class="tab-pane fade" id="panel2" role="tabpanel">
               <app-reestablecer-proveedores></app-reestablecer-proveedores>
              </div>
              <!-- FIN Panel 2 -->

            </div>
            <!--OPCION PARA INGRESO POR CLIENTE-->



            <!--OPCION PARA INGRESO POR PROVEEDOR-->
            <div class="tab-content" *ngIf="idPage==1">

              <!--Panel 1 clientes login-->
              <div class="tab-pane fade" [ngClass]="" id="panel1" role="tabpanel">
                <app-reestablecer-clientes></app-reestablecer-clientes>
              </div>
              <!--FIN Panel 1 -->


              <!--Panel 2 proveedores login-->
              <div class="tab-pane fade active show in" id="panel2" role="tabpanel">
                <app-reestablecer-proveedores></app-reestablecer-proveedores>
              </div>
              <!-- FIN Panel 2 -->

            </div>
            <!--OPCION PARA INGRESO POR PROVEEDOR-->

          </div>

          <!-- Footer -->
          <div class="modal-footer display-footer">
            <div class="options text-center text-md-right">
              <p>¿Volver a <a [routerLink]="['/login']" class="blue-text">ingresar?</a></p>
            </div>
          </div>

        </div>
        <!-- Content -->



      </div>
      <!-- Modal: Login & Register tabs -->


    </div>
    <!-- Grid column -->


  </div>

</div>
