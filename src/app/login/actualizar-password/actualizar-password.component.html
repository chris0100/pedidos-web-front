<div class="row" style="height: 100vh">

  <div class="col-sm-4 sn-bg-4" style="border-right: 5px solid #025f97">

    <div class="text-center mt-2">
      <a class="pl-0"><img src="resources/img/logos/logo-eka.png" alt="" class="adaptive"></a>
    </div>

  </div>


  <div class="col-sm-8 d-flex align-items-center"
       style="background: url(resources/img/demo8/bg-10.jpg); background-position: center; background-size: cover">


    <!-- Grid column -->
    <div class="col-md-6 mb-4 mx-auto">


      <!-- Modal: Login cliente / proveedor tabs -->
      <div class="modal-dialog cascading-modal mt-5 pt-4" role="document">

        <!-- Content -->
        <div class="modal-content">

          <!-- Modal con tabs -->
          <div class="modal-c-tabs">

            <!-- Nav tabs -->
            <ul class="nav md-tabs tabs-2 light-blue darken-3" role="tablist">
              <li class="nav-item">
                <a class="nav-link active" data-toggle="tab" href="#panel1" role="tab">
                  Actualizar Contraseña</a>
              </li>
            </ul>

            <!-- Tab panels -->
            <div class="tab-content">

              <!--Panel 1 clientes login-->
              <div class="tab-pane fade in show active" id="panel1" role="tabpanel">

                <div class="modal-body">


                  <div class="text-center mb-4" style="margin-top: -15px;">
                    <h4 class="font-weight-bold dark-grey-text"><i class="fas fa-key"></i> Portal Web</h4>
                  </div>


                  <form method="post">

                    <div class="md-form md-outline" style="margin-top: 5px">
                      <input type="password"
                             id="password"
                             class="form-control"
                             name="password"
                             [(ngModel)]="password"
                      >
                      <label for="password" class="active">Contraseña de ingreso</label>
                    </div>


                    <div class="md-form md-outline" style="margin-top: 5px">
                      <input type="password"
                             id="repetir-password"
                             class="form-control"
                             name="repetir-password"
                             [(ngModel)]="repetirPassword"
                      >
                      <label for="repetir-password" class="active">Repetir Contraseña</label>
                    </div>


                    <div class="text-center">
                      <button class="btn btn-primary btn-rounded"
                              type="submit"
                              [disabled]="password!=repetirPassword || password.length==0 || repetirPassword.length==0"
                              (click)="guardarPassword()"
                      >
                        Guardar Contraseña
                      </button>
                    </div>


                  </form>

                </div>



              </div>
              <!--FIN Panel 1 -->

            </div>

          </div>

        </div>
        <!-- Content -->


      </div>
      <!-- Modal: Login & Register tabs -->


    </div>
    <!-- Grid column -->


  </div>

</div>
