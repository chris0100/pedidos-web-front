<!-- Body -->

<div class="modal-body">

    <div class="text-center" style="margin-top: -30px;">
      <h5 class="font-weight-bold dark-grey-text"><i class="fas fa-users fa-1x"></i> Portal Web</h5>
    </div>


  <form method="post">

    <div class="md-form md-outline">
      <input type="text"
             id="nit-cliente"
             class="form-control"
             name="nit"
             [(ngModel)]="usuario.nit"
             (change)="obtenerSucursal()"
      >
      <label for="nit-cliente" class="active">Nit Cliente</label>
    </div>


    <div class="row" style="margin-top: -15px;">
      <div class="col-md-12">

        <label class="small">Sucursal</label>
        <select class="custom-select custom-select-sm"
                name="sucursalSeleccionada"
                id="sucursalSeleccionada"
                [(ngModel)]="sucursalSeleccionada"
                (change)="obtenerPuntoEnvio()"
                style="margin-top: -5px"
        >
          <option [value]="item" *ngFor="let item of listadoSucursal">{{item}}</option>
        </select>


      </div>
    </div>



    <div class="row mt-2">
      <div class="col-md-12">

          <label class="small">Punto de Envio</label>
          <select class="custom-select custom-select-sm"
                  name="puntoEnvioSeleccionado"
                  id="puntoEnvioSeleccionado"
                  [(ngModel)]="puntoEnvioSeleccionado"
                  style="margin-top: -5px"
          >
            <option [value]="item" *ngFor="let item of listadoPuntoEnvio">{{item}}</option>
          </select>

      </div>
    </div>




    <div class="md-form md-outline mt-4">
      <input type="password"
             id="password-cliente"
             class="form-control"
             name="password"
             [(ngModel)]="usuario.password"
      >
      <label for="password-cliente" class="active">Contraseña</label>
    </div>


    <div class="text-center">
      <button class="btn btn-primary btn-rounded"
              type="submit"
              (click)="loginCliente()"
      >
        Ingresar <i class="fas fa-sign-in-alt ml-1"></i>
      </button>
    </div>


  </form>

</div>


  <!-- Footer -->
  <div class="modal-footer display-footer">
    <div class="options text-center text-md-right">
      <p>¿Necesitas <a [routerLink]="['/ayuda']" class="blue-text">Ayuda?</a></p>
      <p style="margin-top: -10px">¿Contraseña <a [routerLink]="['/reestablecer-password', 0]" class="blue-text">Olvidada?</a></p>
     <!-- <p>¿Ingresar como <a [routerLink]="['/login-admin']" class="blue-text">Administrador?</a></p>-->
    </div>
  </div>
